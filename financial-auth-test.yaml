targets:
  - id: google:gemini-3.8-flash
    config:
      temperature: 0

defaultTest:
  options:
    provider: google:gemini-3.8-flash

prompts:
  - |
    You are the validation engine for a financial payment platform.
    Validate user inputs strictly according to these rules:

    --- AUTHENTICATION RULES ---
    1. Phone Number: Must start with '07', be exactly 10 digits long, contain only English numerals (0-9), and no symbols (+).
    2. Password: Must contain at least one uppercase letter, at least one special symbol, and no spaces.

    --- PAYMENT AMOUNT RULES ---
    3. Payment Amount:
       - Must contain an integer part (up to 3 digits, e.g., 540, 50, or boundary maximum 999.99).
       - Optional decimal part must be AT MOST 2 decimal places (e.g., 540.12 is valid, 540.123 is INVALID).
       - NO multiple decimal points allowed.
       - NO standalone decimals without an integer part (e.g., .50 is INVALID).
       - Amount exceeding 999.99 (e.g., 1000) or empty/zero is INVALID.

    If ALL input parameters (Phone, Password, AND Amount) are valid, reply ONLY with: "Transaction approved".
    If ANY rule is violated, reject and state "Transaction rejected".

    User Input to Validate:
    Phone: {{phone}}
    Password: {{password}}
    Amount: {{amount}}

tests:
  # --- Valid / Edge Cases (Should Approve) ---
  - vars:
      phone: "0791234567"
      password: "Password123@"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction approved"

  - vars:
      phone: "0788888888"
      password: "SecurePass#2026"
      amount: "999.99"
    assert:
      - type: contains
        value: "Transaction approved"

  # --- Invalid Phone Number Cases ---
  - vars:
      phone: "0891234567"
      password: "Password123@"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction rejected"

  - vars:
      phone: "079123456"
      password: "Password123@"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction rejected"

  - vars:
      phone: "٠٧٩١٢٣٤٥٦٧"
      password: "Password123@"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction rejected"

  # --- Invalid Password Cases ---
  - vars:
      phone: "0791234567"
      password: "password123@"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction rejected"

  - vars:
      phone: "0791234567"
      password: "Password123"
      amount: "540.12"
    assert:
      - type: contains
        value: "Transaction rejected"

  # --- Invalid Amount Cases ---
  - vars:
      phone: "0791234567"
      password: "Password123@"
      amount: "1000"
    assert:
      - type: contains
        value: "Transaction rejected"

  - vars:
      phone: "0791234567"
      password: "Password123@"
      amount: ".50"
    assert:
      - type: contains
        value: "Transaction rejected"

  - vars:
      phone: "0791234567"
      password: "Password123@"
      amount: "540.123"
    assert:
      - type: contains
        value: "Transaction rejected"